[project]
name = "matb-analysis"
version = "0.1.0"
description = "OpenMATB explanation-form study analysis (F1/F2/F3): transparency, mental model, miss detection, non-aided performance (H1-H4)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyterlab>=4.2",
]

[dependency-groups]
dev = [
    "nbformat>=5.10.4",
    "pytest>=8.0",
]
